<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RollupWatchdog — consensus-backed L2 health oracle</title>
<style>
  :root {
    --bg: #06121c; --panel: #0d1f2d; --line: #1d3a4f; --ink: #e6f1f8;
    --muted: #8fa9bd; --accent: #52d6ff;
    --healthy: #35d07f; --degraded: #f5a623; --halted: #ff5f5f; --unknown: #7d8ea0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; letter-spacing: .08em;
          text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  select, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: #0a1a26; color: var(--ink); padding: 11px 14px;
  }
  select { width: 100%; margin-bottom: 14px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--accent); color: #04121b; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .verdict-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--unknown); }
  .status { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .HEALTHY .dot { background: var(--healthy); } .HEALTHY .status { color: var(--healthy); }
  .DEGRADED .dot { background: var(--degraded); } .DEGRADED .status { color: var(--degraded); }
  .HALTED .dot { background: var(--halted); } .HALTED .status { color: var(--halted); }
  .INDETERMINATE .dot { background: var(--unknown); } .INDETERMINATE .status { color: var(--unknown); }
  .assessed { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
  .summary { margin: 0 0 14px; }
  .evidence { margin: 14px 0 0; font-size: 14px; }
  .evidence a { color: var(--accent); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .fact { background: #091825; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .fact b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
            color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .stale { color: var(--degraded); }
  .wallet { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
  .wallet code { font-size: 12.5px; word-break: break-all; color: var(--ink); }
  .wallet .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .hint.warn { color: var(--degraded); }
  #log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
         color: var(--muted); white-space: pre-wrap; word-break: break-word; margin: 14px 0 0; }
  .err { color: var(--halted); }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>RollupWatchdog</h1>
  <p class="sub">A consensus-backed health verdict for L2 rollups, judged on-chain by
     independent GenLayer validators.</p>

  <div class="panel">
    <label for="chain">Chain</label>
    <select id="chain"><option>Loading configured chains…</option></select>
    <button id="run" class="primary" disabled>Run assessment</button>
    <button id="refresh" disabled>Read latest verdict</button>
    <p id="log">Connecting…</p>

    <div class="wallet">
      <label>Session account</label>
      <div class="row">
        <code id="account">…</code>
        <button id="copy">Copy</button>
        <button id="fundbtn" disabled>Fund 10 GEN</button>
      </div>
      <p class="hint" id="balance"></p>
      <p class="hint" id="fund"></p>
    </div>
  </div>

  <div class="panel" id="verdict" hidden>
    <div class="verdict-head"><span class="dot"></span><span class="status"></span></div>
    <p class="assessed"></p>
    <p class="summary"></p>
    <div class="facts"></div>
    <p class="evidence"></p>
  </div>

  <footer>
    Contract <a id="explorer" href="#" target="_blank" rel="noreferrer"><span id="addr"></span></a>
    on GenLayer Studio Next ·
    <a href="https://github.com/aplombird-x/rollup-watchdog" target="_blank" rel="noreferrer">source</a>
  </footer>
</main>

<script type="module">
// Your Studio Next deployment.
const CONFIG = {
  contract: "0x9bB01d8B136527698f6196a28aD657e8800E22B7",
  // Each Studio instance has its own chain id (dev 61997, staging 61998,
  // production 61999) and genlayer-js bundles only production, so the chain is
  // defined locally. The endpoint allows cross-origin requests, which is what
  // lets GitHub Pages call it directly.
  rpcUrl: "https://studio-dev.genlayer.com/api",
  chainId: 61997,
  // Pinned: npm "latest" is 1.1.8, which predates Studio's fee enforcement and
  // sends writes the consensus contract rejects.
  sdkVersion: "2.0.0-rc.1",
  explorer: "https://explorer-studio-dev.genlayer.com",
};

// Errors are surfaced verbatim rather than swallowed.
const log = document.getElementById("log");
const say = (msg, isError = false) => {
  log.textContent = msg;
  log.className = isError ? "err" : "";
  if (isError) console.error(msg);
};

let client, account, sdkIsSuccessful, chainsById = {};

const el = {
  chain: document.getElementById("chain"),
  run: document.getElementById("run"),
  refresh: document.getElementById("refresh"),
  verdict: document.getElementById("verdict"),
};

document.getElementById("addr").textContent = CONFIG.contract;
document.getElementById("explorer").href = `${CONFIG.explorer}/address/${CONFIG.contract}`;

// `networks` is the genlayer-js/chains module: GenLayer's own networks
// (localnet, studionet, testnet*), not the L2s this oracle watches.
function studioNextChain(sdk, networks) {
  // Start from the production export so SDK-specific fields carry over, then
  // override everything instance-specific.
  const template = networks.studionet ?? Object.values(networks).find(Boolean) ?? {};
  const definition = {
    nativeCurrency: { name: "GEN", symbol: "GEN", decimals: 18 },
    ...template,
    id: CONFIG.chainId,
    name: "GenLayer Studio Next",
    rpcUrls: { default: { http: [CONFIG.rpcUrl] }, public: { http: [CONFIG.rpcUrl] } },
    blockExplorers: undefined,   // inherited; would point at the wrong instance
  };
  return typeof sdk.defineChain === "function" ? sdk.defineChain(definition) : definition;
}

// Node methods, not contract calls, so they bypass the SDK client.
async function rpc(method, params) {
  const response = await fetch(CONFIG.rpcUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method, params }),
  });
  const body = await response.json();
  // Surface the RPC's own error (rate limits land here) instead of hiding it.
  if (body.error) {
    throw new Error(body.error.message ?? JSON.stringify(body.error));
  }
  return body.result;
}

function formatGen(wei) {
  const whole = wei / 10n ** 18n;
  const frac = (wei % 10n ** 18n).toString().padStart(18, "0").slice(0, 4);
  return `${whole}.${frac} GEN`;
}

async function refreshBalance() {
  const balance = document.getElementById("balance");
  if (!account) return (balance.textContent = "");
  try {
    const wei = BigInt(await rpc("eth_getBalance", [account.address, "latest"]));
    const funded = wei > 0n;
    balance.textContent = `Balance: ${formatGen(wei)}${funded ? "" : " — fund before assessing"}`;
    balance.className = funded ? "hint" : "hint warn";
  } catch (error) {
    balance.textContent = `Balance unavailable: ${error.message}`;
    balance.className = "hint warn";
  }
}

// The faucet Studio's own Fund button calls. Amount is wei as a string — a
// bare 10 would send ten wei and look like success.
const FUND_AMOUNT_WEI = "10000000000000000000";

async function fundAccount() {
  const button = document.getElementById("fundbtn");
  button.disabled = true;
  try {
    say(`Requesting ${formatGen(BigInt(FUND_AMOUNT_WEI))} from the dev faucet…`);
    await rpc("sim_fundAccount", [account.address, FUND_AMOUNT_WEI]);
    await refreshBalance();
    say("Funded. You can run an assessment now.");
  } catch (error) {
    say(`Funding failed: ${error.message}`, true);
  } finally {
    button.disabled = !account;
  }
}

// Writes cost GEN, so the caller needs a funded account. The key is generated
// once and kept in localStorage, so the address is stable and fundable.
const STORAGE_KEY = "rollup-watchdog.pk";

function newPrivateKey() {
  const bytes = crypto.getRandomValues(new Uint8Array(32));
  return "0x" + [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function buildAccount(sdk, privateKey) {
  // A factory that silently ignores the key returns a fresh random account
  // each call, leaving the address unfundable. Building twice and comparing
  // catches that; a rejected key just throws.
  for (const name of ["createAccount", "privateKeyToAccount", "accountFromPrivateKey"]) {
    if (typeof sdk[name] !== "function") continue;
    try {
      const first = sdk[name](privateKey);
      const second = sdk[name](privateKey);
      if (first?.address && first.address === second?.address) return first;
      console.warn(`${name}() ignored the private key (non-deterministic address)`);
    } catch (error) {
      console.warn(`${name}(privateKey) failed:`, error);
    }
  }
  return null;
}

// A CDN keeps this a single static file with no build step. The plain build
// pulls 18 dependency chunks that esm.sh compiles on demand, and a cold
// compile can time out (HTTP 524) and blank the page; ?bundle inlines them
// into one file. The plain URL stays as the fallback.
function sdkUrls(path) {
  const pkg = `https://esm.sh/genlayer-js@${CONFIG.sdkVersion}${path}`;
  return [`${pkg}?bundle&target=es2022`, pkg];
}

async function importFirst(urls, label) {
  const failures = [];
  for (const url of urls) {
    try {
      const mod = await import(url);
      console.info(`${label} loaded from ${url}`);
      return mod;
    } catch (error) {
      failures.push(`  ${url}\n    ${error.message}`);
    }
  }
  throw new Error(`could not load ${label}:\n${failures.join("\n")}`);
}

async function connect() {
  const [sdk, networks] = await Promise.all([
    importFirst(sdkUrls(""), "genlayer-js"),
    // Only a template; without it studioNextChain defines the network itself.
    importFirst(sdkUrls("/chains"), "genlayer-js/chains").catch((error) => {
      console.warn("genlayer-js/chains unavailable:", error.message);
      return {};
    }),
  ]);
  sdkIsSuccessful = sdk.isSuccessful;
  const key = localStorage.getItem(STORAGE_KEY) || newPrivateKey();
  const built = buildAccount(sdk, key);
  if (built) {
    // Persist only once the key proves usable, so a future SDK change that
    // rejects it cannot overwrite a key whose account holds funds.
    localStorage.setItem(STORAGE_KEY, key);
    account = built;
  }
  // Paint the account before building the client: if that fails the user
  // should still see, and be able to fund, their address.
  showAccount();
  const chain = studioNextChain(sdk, networks);
  // Reads need no account, so a client without one is still useful.
  client = sdk.createClient(account ? { chain, account } : { chain });
  say(`Connected to ${CONFIG.rpcUrl} (chain ${CONFIG.chainId}).`);
  // No verification read: loadChains() runs next and fails just as clearly.
  return Boolean(account);
}

function showAccount() {
  const fund = document.getElementById("fund");
  document.getElementById("account").textContent = account?.address ?? "unavailable";
  if (!account) {
    fund.className = "hint warn";
    fund.textContent =
      "No usable account, so assessments are disabled — reading verdicts still " +
      "works. See the console for which genlayer-js factory was tried.";
    return;
  }
  document.getElementById("fundbtn").disabled = false;
  refreshBalance();
  fund.className = "hint";
  fund.innerHTML =
    "Reading verdicts is free. <b>Running an assessment costs GEN</b>, so use " +
    "Fund first. The key is generated and kept in this browser, so the address " +
    "stays the same across reloads — testnet only.";
}

async function loadChains() {
  const raw = await client.readContract({
    address: CONFIG.contract, functionName: "list_chains", args: [],
  });
  const configured = JSON.parse(raw);
  chainsById = Object.fromEntries(configured.map((c) => [c.id, c]));
  el.chain.innerHTML = configured
    .map((c) => {
      const signals = c.status_url ? "block freshness + status page" : "block freshness only";
      return `<option value="${c.id}">${c.name} — ${signals}</option>`;
    })
    .join("");
  return configured;
}

// A verdict carries no transaction hash, so match it to its round by
// assessed_at_unix, which is generated once per execution.
let assessments = [];

async function readAssessments() {
  try {
    const list = await rpc("sim_getTransactionsForAddress", [CONFIG.contract]);
    assessments = (list ?? []).flatMap((tx) => {
      // Accept a decided round, not only a finalized one: waitForDecision
      // returns before finalization.
      if (!/^(ACCEPTED|FINALIZED)$/i.test(tx.status ?? "") || !tx.result) return [];
      let verdict;
      try {
        // Observed as both a JSON string and an object across deployments.
        verdict = typeof tx.result === "string" ? JSON.parse(tx.result) : tx.result;
      } catch {
        return [];
      }
      if (typeof verdict?.assessed_at_unix !== "number") return [];
      const tally = {};
      for (const vote of Object.values(tx.consensus_data?.votes ?? {})) {
        tally[vote] = (tally[vote] ?? 0) + 1;
      }
      return [{ hash: tx.hash, assessedAt: verdict.assessed_at_unix, tally }];
    });
  } catch (error) {
    // Additive only: without the history a verdict shows no votes.
    console.warn("assessment history unavailable:", error);
    assessments = [];
  }
}

// The transaction list lags a write by a moment, so a just-run assessment can
// be missing from it. Poll until `hash` appears rather than rendering the fresh
// verdict with no vote tally. Called without a hash, this is a plain refresh.
const LIST_POLL_INTERVAL_MS = 1_500;
const LIST_POLL_WINDOW_MS = 10_000;

async function refreshAssessments(hash) {
  const attempts = Math.ceil(LIST_POLL_WINDOW_MS / LIST_POLL_INTERVAL_MS);
  for (let attempt = 0; ; attempt++) {
    await readAssessments();
    if (!hash || attempt === attempts) return;
    if (assessments.some((a) => a.hash === hash)) return;
    await new Promise((resolve) => setTimeout(resolve, LIST_POLL_INTERVAL_MS));
  }
}

// Report votes as cast: idle validators did not agree, so a bare "5/5" would
// overstate the round.
function describeVotes(tally) {
  const total = Object.values(tally).reduce((sum, n) => sum + n, 0);
  if (!total) return "";
  const rest = Object.entries(tally)
    .filter(([vote]) => vote !== "agree")
    .map(([vote, n]) => `${n} ${vote}`)
    .join(", ");
  return `${tally.agree ?? 0}/${total} agreed` + (rest ? ` · ${rest}` : "");
}

// "41741s ago" is not a readable answer to "how old is this?".
function humanAge(seconds) {
  if (seconds < 10) return "just now";
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  const unit = seconds < 86400 ? 3600 : 86400;
  const big = Math.floor(seconds / unit);
  const small = Math.floor((seconds % unit) / (unit / 60));
  const [a, b] = unit === 3600 ? ["h", "m"] : ["d", "h"];
  return small ? `${big}${a} ${small}${b} ago` : `${big}${a} ago`;
}

function render(json, txHash) {
  if (!json) {
    el.verdict.hidden = true;
    return;
  }
  const v = JSON.parse(json);
  el.verdict.hidden = false;
  el.verdict.className = `panel ${v.status}`;
  el.verdict.querySelector(".status").textContent = v.status;
  el.verdict.querySelector(".summary").textContent = v.summary;

  // Date.now() is epoch-based, so this is right in every timezone — but it
  // trusts the device clock. A future-dated verdict means that clock is behind;
  // say so rather than clamp to 0 and imply the verdict is fresh.
  const skew = v.assessed_at_unix - Math.floor(Date.now() / 1000);
  const ageSeconds = Math.max(0, -skew);
  const clockOff = skew > 120;
  const stale = ageSeconds > 600;

  // Every figure below is from the assessment; only this line is relative to
  // now. Stating that stops "produced 5 seconds ago" reading as "before load".
  const when = new Date(v.assessed_at_unix * 1000)
    .toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  el.verdict.querySelector(".assessed").innerHTML = clockOff
    ? '<span class="stale">Dated in the future — this device\'s clock is behind.</span>'
    : `<span class="${stale ? "stale" : ""}">Assessed ${humanAge(ageSeconds)}</span>` +
      ` · ${when} · the figures below are from that moment`;

  const fact = (label, value, cls = "") =>
    `<div class="fact"><b>${label}</b><span class="${cls}">${value}</span></div>`;

  el.verdict.querySelector(".facts").innerHTML = [
    fact("Latest block", v.block_number ?? "unknown"),
    fact("Block age", v.block_age_seconds === null ? "unknown" : `${v.block_age_seconds}s`),
    fact("Age bucket", v.block_age_bucket),
  ].join("");

  // Votes come from the RPC list; txHash covers an assessment just run, whose
  // transaction may not be listed there yet.
  const match = assessments.find((a) => a.assessedAt === v.assessed_at_unix);
  const hash = match?.hash ?? txHash;
  const votes = match ? describeVotes(match.tally) : "";
  el.verdict.querySelector(".evidence").innerHTML = hash
    ? `${votes ? `${votes} · ` : ""}` +
      `<a href="${CONFIG.explorer}/tx/${hash}" target="_blank" rel="noreferrer">` +
      "See how the validators voted &rarr;</a>"
    : "";
}

async function readVerdict(chainId, txHash) {
  say(`Reading stored verdict for ${chainId}…`);
  const stored = await client.readContract({
    address: CONFIG.contract, functionName: "get_assessment", args: [chainId],
  });
  if (!stored) {
    render(null);
    say(`No verdict stored yet for ${chainId}. Run an assessment to create one.`);
    return;
  }
  render(stored, txHash);
  say(`Latest consensus verdict for ${chainsById[chainId]?.name ?? chainId}.`);
}

async function runAssessment(chainId) {
  el.run.disabled = el.refresh.disabled = el.chain.disabled = true;
  try {
    const write = {
      address: CONFIG.contract,
      functionName: "assess",
      args: [chainId],
    };
    // Estimating per click is the documented development pattern; production
    // apps ship a checked-in fee profile instead.
    say("Estimating the execution budget…");
    const estimate = await client.estimateTransactionFeesForWrite(write);
    console.info("fee estimate", estimate);

    say(`Submitting assess("${chainId}")… each validator fetches the signals independently.`);
    // `value` is for payable methods only; the fee is a separate deposit.
    const hash = await client.writeContract({
      ...write,
      fees: { distribution: estimate.distribution, feeValue: estimate.feeValue },
    });

    say(`Transaction ${hash} submitted. Waiting for consensus — this can take a few minutes…`);
    // Decision, not finalization: the verdict is stored once the decision
    // lands. Five minutes, not the SDK's 30s default — each of five validators
    // makes up to four fetches and an LLM call.
    const receipt = await client.waitForDecision({
      hash, interval: 3_000, retries: 100,
    });
    // A decision is not proof of successful execution, so ask.
    if (sdkIsSuccessful && !sdkIsSuccessful(receipt)) {
      throw new Error(
        `${receipt?.statusName ?? "finalized"} / ` +
        `${receipt?.txExecutionResultName ?? "unknown execution result"}`
      );
    }
    say(`Consensus reached. Transaction ${hash}`);
    await refreshAssessments(hash);
    await readVerdict(chainId, hash);
  } catch (error) {
    // An unfunded account and the 60s throttle are both expected; name them.
    const detail = String(error?.message ?? error);
    const hint = /fund|balance|insufficient/i.test(detail)
      ? " — fund the session address above from the Studio Next faucet."
      : /wait \d+s|was assessed/i.test(detail)
      ? " — this chain was assessed under a minute ago; try another chain."
      : "";
    say(`Assessment failed: ${detail}${hint}`, true);
  } finally {
    el.run.disabled = el.refresh.disabled = el.chain.disabled = false;
  }
}

document.getElementById("fundbtn").addEventListener("click", fundAccount);

document.getElementById("copy").addEventListener("click", () => {
  navigator.clipboard?.writeText(account?.address ?? "");
  say("Session address copied. Fund it, then run an assessment.");
});

el.run.addEventListener("click", () => runAssessment(el.chain.value));
// Refresh the history first: the chain may have votes this page has not seen.
const reload = () =>
  refreshAssessments()
    .then(() => readVerdict(el.chain.value))
    .catch((e) => {
      render(null);   // never leave another chain's verdict on screen
      say(`Read failed: ${e?.message ?? e}`, true);
    });

el.refresh.addEventListener("click", reload);
el.chain.addEventListener("change", reload);

(async function start() {
  try {
    const usable = await connect();
    const configured = await loadChains();
    // Reads never need an account; only the write button depends on one.
    el.refresh.disabled = false;
    el.run.disabled = !usable;
    await refreshAssessments();
    await readVerdict(configured[0].id);
  } catch (error) {
    say(`Could not connect: ${error?.message ?? error}`, true);
  }
})();
</script>
</body>
</html>
